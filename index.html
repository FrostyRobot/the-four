<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="the five" />
<meta name="theme-color" content="#f7ebe4" />
<title>the five</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    --ink:#26281f; --muted:#7c7d6e; --faint:#a9a99a;
    --paper:#f7ebe4; --panel:#fcf4ef; --line:#ecddd1;
    --moss:#d97757; --moss-soft:#f3ddd1;
    --teal:#3d7a86; --teal-soft:#cfe0e2;
    --amber:#bd7a2c;
    --dead:#e0842a; --dead-soft:#f9e3ca;
    --done:#3f8a52; --done-soft:#d9ecdf;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  .wrap {
    min-height:100%;
    padding:calc(22px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  .board { width:100%; max-width:440px; }
  .serif { font-family:"Fraunces", Georgia, serif; }

  .top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .mark { font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:19px; }
  .mark small { color:var(--ink); font-weight:400; font-size:13px; margin-left:7px; }
  .kcalnote { font-size:12px; color:var(--ink); white-space:nowrap; }
  .headright { display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
  .dayflags { display:flex; gap:6px; justify-content:flex-end; align-items:center; flex-wrap:wrap; }
  .flagtoggle.on.dh { background:var(--ink); border-color:var(--ink); color:#fff; }
  .whey { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:3px 6px 3px 10px; }
  .wheylbl { font-size:12px; color:var(--ink); margin-right:1px; }
  .wheybtn { width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:var(--paper); color:var(--ink); display:grid; place-items:center; cursor:pointer; padding:0; }
  .wheybtn:active { transform:scale(.9); }
  .wheyval { font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:17px; min-width:16px; text-align:center; }
  .flagtoggle { font-family:inherit; font-size:12px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; white-space:nowrap; }
  .flagtoggle:active { transform:scale(.96); }
  .flagtoggle.on.complete { background:var(--done); border-color:var(--done); color:#fff; }
  .flagtoggle.on.dead { background:var(--dead); border-color:var(--dead); color:var(--ink); }
  .deadnote { color:var(--ink); }

  .weeknav { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .wkbtn { width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); display:grid; place-items:center; cursor:pointer; padding:0; }
  .wkbtn:hover { border-color:#cfc9b6; }
  .wkbtn:active { transform:scale(.92); }
  .wkcenter { flex:1 1 auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .wkrange { font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:16px; line-height:1; }
  .wkstart { font-family:inherit; font-size:12px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:3px 7px; }
  .wkt { font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:15px; }
  .strip { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px; }
  .day { border:1px solid var(--line); background:var(--panel); border-radius:12px;
    padding:8px 2px 7px; text-align:center; cursor:pointer; transition:background .12s,border-color .12s; position:relative; }
  .day:hover { border-color:#cfc9b6; }
  .day.sel { background:var(--ink); border-color:var(--ink); }
  .day.sel .dow, .day.sel .dtot { color:var(--panel); }
  .dow { font-size:11px; color:var(--ink); }
  .dtot { font-family:"Fraunces",Georgia,serif; font-size:16px; font-weight:600; margin-top:3px; line-height:1; }
  .dtot.zero { color:var(--ink); font-weight:400; }
  .todot { width:4px; height:4px; border-radius:50%; background:var(--moss); position:absolute; top:6px; right:6px; }
  .day.sel .todot { background:var(--moss-soft); }
  .day.dead { background:var(--dead-soft); border-color:#edcca1; }
  .day.dead .dow, .day.dead .dtot { color:var(--ink); }
  .day.sel.dead { border-color:var(--dead); }
  .day.dead .todot { background:var(--dead); }
  .day.done { background:var(--done-soft); border-color:#b3d6c0; }
  .day.done .dow, .day.done .dtot { color:var(--ink); }
  .day.sel.done { border-color:var(--done); }
  .day.done .todot { background:var(--done); }

  .head { display:flex; align-items:flex-start; justify-content:space-between; margin:2px 2px 14px; }
  .hlabel { font-size:13px; color:var(--ink); }
  .bignum { font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:50px; line-height:.9; }
  .bignum span { font-size:19px; font-weight:600; color:var(--ink); margin-left:4px; }
  .breakdown { font-size:12px; color:var(--ink); margin-top:5px; }
  .breakdown .ex { color:var(--ink); }

  .sect { font-size:12px; color:var(--ink); margin:20px 2px 6px; display:flex; align-items:center; gap:6px; }
  .sect .ex { color:var(--ink); font-weight:600; }
  .sect small { color:var(--ink); }
  .items { border-top:1px solid var(--line); }
  .item { display:flex; align-items:center; gap:8px; padding:5px 4px; border-bottom:1px solid var(--line); }
  .ilabel { flex:0 0 64px; }
  .ilabel b { font-weight:600; font-size:15.5px; }
  .controls { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .time { font-family:inherit; font-size:13px; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
  .time.checked { background:var(--done-soft); }
  .mealcheck { width:17px; height:17px; accent-color:var(--done); cursor:pointer; margin:0 10px 0 0; flex:0 0 auto; }

  .pips { display:flex; flex-wrap:wrap; gap:4px; align-items:center; flex:1 1 auto; min-width:30px; }
  .rowkcal { flex:1 1 auto; font-size:13px; color:var(--ink); }
  .rowkcal.ex { color:var(--ink); }
  .rowkcal.nogrow { flex:0 0 auto; }
  .alcnote { flex:1 1 auto; min-width:0; font-family:inherit; font-size:13px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .pip { width:9px; height:9px; border-radius:50%; }
  .pips.food .pip { background:var(--moss-soft); }
  .pips.food .pip.on { background:var(--moss); }
  .pips.ex .pip { background:var(--teal-soft); }
  .pips.ex .pip.on { background:var(--teal); }
  .more { font-size:11px; color:var(--ink); margin-left:2px; }

  .stepper { display:flex; align-items:center; gap:3px; flex:0 0 auto; }
  .btn { width:40px; height:40px; border-radius:11px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); display:grid; place-items:center; cursor:pointer;
    transition:transform .06s,border-color .12s; padding:0; }
  .btn:hover { border-color:#cfc9b6; }
  .btn:active { transform:scale(.92); }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.plus { background:var(--ink); color:var(--panel); border-color:var(--ink); }
  .btn.plus.ex { background:var(--moss); border-color:var(--moss); }
  .mval { font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:19px; width:46px; text-align:center; }
  .mval.ex { color:var(--ink); }

  .gap { text-align:center; font-size:11px; color:var(--ink); padding:5px 0; letter-spacing:.3px; }

  .week { margin-top:8px; }
  .wrow { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .wrow .lbl { font-size:13px; color:var(--ink); }
  .wnum { font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:22px; }
  .wnum .of { color:var(--ink); font-weight:400; font-size:16px; }
  .track { height:12px; border-radius:99px; background:var(--moss-soft); overflow:hidden; }
  .fill { height:100%; border-radius:99px; background:var(--moss); transition:width .35s ease; }
  .fill.over { background:var(--amber); }
  .wsub { display:flex; justify-content:space-between; margin-top:6px; }
  .wsub .brk { font-size:12px; color:var(--ink); }
  .wsub .brk .ex { color:var(--ink); }
  .rem { font-size:13px; color:var(--ink); font-weight:600; }
  .rem.over { color:var(--ink); }

  .foot { display:flex; align-items:center; justify-content:space-between; margin-top:22px; gap:12px; flex-wrap:wrap; }
  .bud { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink); }
  .budstep { display:flex; align-items:center; gap:4px; }
  .sbtn { width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--panel); cursor:pointer; display:grid; place-items:center; padding:0; }
  .sbtn:active { transform:scale(.9); }
  .budval { font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:16px; min-width:26px; text-align:center; }
  .budinput { width:58px; font-weight:600; font-size:16px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px 8px; text-align:center; }
  .budinput::-webkit-outer-spin-button, .budinput::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .budinput { -moz-appearance:textfield; appearance:textfield; }
  .footbtns { display:flex; gap:2px; flex-wrap:wrap; justify-content:flex-end; }
  .reset { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink); background:none; border:none; cursor:pointer; padding:6px; }
  .reset:hover { color:var(--ink); }

  .datapanel { margin-top:14px; border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:16px; }
  .dtitle { font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:15px; margin-bottom:12px; }
  .dbtns { display:flex; flex-wrap:wrap; gap:8px; }
  .dbtns button { flex:1 1 auto; font-family:inherit; font-size:12.5px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:9px 10px; cursor:pointer; }
  .dbtns button:hover { border-color:#cfc9b6; }
  .dout { margin-top:10px; }
  .dta { width:100%; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11.5px;
    color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:9px; resize:vertical; line-height:1.4; }
  .dcopy { margin-top:8px; display:inline-flex; align-items:center; gap:5px; font-family:inherit;
    font-size:12.5px; color:var(--panel); background:var(--ink); border:1px solid var(--ink);
    border-radius:9px; padding:8px 12px; cursor:pointer; }
  .dcopy:disabled { opacity:.4; cursor:default; }
  .doutbtns { display:flex; gap:8px; margin-top:8px; }
  .doutbtns .dcopy { margin-top:0; }
  .dcopy.ghost { background:var(--paper); color:var(--ink); border-color:var(--line); }
  .backupline { text-align:right; font-size:12px; color:var(--ink); margin-top:8px; cursor:pointer; }
  .backupline.stale { color:var(--ink); }
  .dsep { margin:16px 0 8px; font-size:12px; color:var(--ink); }
  .dmsg { margin-top:10px; font-size:12px; color:var(--ink); line-height:1.45; min-height:1em; }

  .hint { margin-top:16px; font-size:12px; color:var(--ink); line-height:1.5; text-align:center; }
  @media (prefers-reduced-motion: reduce) { .fill,.btn,.day { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <div id="main"></div>

    <div id="datapanel" class="datapanel" style="display:none">
      <div class="dtitle">Back up &amp; move your data</div>
      <div class="dbtns">
        <button data-action="exportjson">Back up (for another device)</button>
        <button data-action="exporttsv">Copy for spreadsheet</button>
      </div>
      <div id="dp-out-wrap" class="dout" style="display:none">
        <textarea id="dp-out" class="dta" readonly rows="5"></textarea>
        <div class="doutbtns">
          <button class="dcopy" data-action="saveout"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><polyline points="8 6 12 2 16 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Save&hellip;</button>
          <button class="dcopy ghost" data-action="copyout">Copy</button>
        </div>
      </div>
      <div class="dsep">Restore a backup here</div>
      <textarea id="dp-in" class="dta" placeholder="Paste a JSON backup from your other device&hellip;" rows="3"></textarea>
      <button class="dcopy" data-action="restore">Restore</button>
      <div id="dp-msg" class="dmsg"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- config ---------- */
  var STEP = 0.25, KCAL_PER_POINT = 500;
  var MAX_MEAL = 6, MAX_FIELD = 6, MAX_EX = 12, DEFAULT_BUDGET = 35;
  var LS = window.localStorage;

  /* ---------- icons ---------- */
  var ICON = {
    minus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    plus:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    minus14: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    plus14:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    flame: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3d7a86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
    rot: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
    db: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>',
    chevL: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
    chevR: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
    share: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><polyline points="8 6 12 2 16 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>'
  };

  /* ---------- helpers ---------- */
  function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, ""); }
  function num(x) { return (typeof x === "number" && !isNaN(x)) ? x : 0; }
  function clampPt(v, max) { return Math.max(0, Math.min(max, +v.toFixed(2))); }

  function emptyDay() {
    return { meals: [ {p:0,t:"",c:false},{p:0,t:"",c:false},{p:0,t:"",c:false},{p:0,t:"",c:false},{p:0,t:"",c:false} ], extras:0, alcohol:0, exercise:0, dead:false, complete:false, alcoholNote:"", whey:0, dh:false };
  }
  function normalizeDay(raw) {
    var d = emptyDay();
    if (!raw) return d;
    if (Array.isArray(raw)) {
      d.meals[0].p = num(raw[0]); d.meals[1].p = num(raw[1]); d.meals[2].p = num(raw[2]); d.extras = num(raw[3]);
      return d;
    }
    if (Array.isArray(raw.meals)) {
      for (var i = 0; i < 5; i++) {
        if (raw.meals[i]) {
          d.meals[i].p = num(raw.meals[i].p);
          d.meals[i].t = typeof raw.meals[i].t === "string" ? raw.meals[i].t : "";
          d.meals[i].c = !!raw.meals[i].c;
        }
      }
    }
    d.extras = num(raw.extras); d.alcohol = num(raw.alcohol); d.exercise = num(raw.exercise); d.dead = !!raw.dead; d.complete = !!raw.complete;
    d.alcoholNote = typeof raw.alcoholNote === "string" ? raw.alcoholNote : "";
    d.whey = Math.max(0, Math.round(num(raw.whey)));
    d.dh = !!raw.dh;
    return d;
  }
  function escAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function consumeOf(d) { return d.meals.reduce(function (a, m) { return a + m.p; }, 0) + d.extras + d.alcohol; }
  function netOf(d) { return consumeOf(d) - d.exercise; }

  function toKey(d) {
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + day;
  }
  function mondayOf(ref) {
    var d = new Date(ref), dow = (d.getDay() + 6) % 7;
    var m = new Date(d); m.setDate(d.getDate() - dow); m.setHours(0, 0, 0, 0);
    return m;
  }
  function addDays(ref, n) { var x = new Date(ref); x.setDate(x.getDate() + n); x.setHours(0, 0, 0, 0); return x; }
  function daysFrom(start) {
    var out = [];
    for (var i = 0; i < 7; i++) out.push(addDays(start, i));
    return out;
  }
  function rangeLabel(start) {
    var end = addDays(start, 6);
    var mon = function (d) { return d.toLocaleDateString("en-GB", { month: "short" }); };
    var y = end.getFullYear();
    if (start.getMonth() === end.getMonth()) return start.getDate() + " \u2013 " + end.getDate() + " " + mon(end) + " " + y;
    return start.getDate() + " " + mon(start) + " \u2013 " + end.getDate() + " " + mon(end) + " " + y;
  }
  function mins(t) { if (!t) return null; var p = t.split(":"); return (+p[0])*60 + (+p[1]); }
  function gapStr(a, b) {
    var x = mins(a), y = mins(b);
    if (x == null || y == null) return null;
    var g = y - x; if (g <= 0) return null;
    var h = Math.floor(g/60), mm = g % 60;
    return (h ? h + "h " : "") + mm + "m";
  }
  function dowLabel(date) { return date.toLocaleDateString("en-GB", { weekday: "short" }).toUpperCase(); }
  function dayHeading(d) {
    if (!d) return "";
    if (d.key === state.todayKey) return "Today";
    return d.date.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  }

  /* ---------- storage (localStorage) ---------- */
  function loadDayLS(key) { try { var v = LS.getItem("day:" + key); return normalizeDay(v ? JSON.parse(v) : null); } catch (e) { return emptyDay(); } }
  function saveDayLS(key, data) { try { LS.setItem("day:" + key, JSON.stringify(data)); } catch (e) {} }
  function delDayLS(key) { try { LS.removeItem("day:" + key); } catch (e) {} }
  function loadBudgetsLS() {
    try {
      var v = LS.getItem("settings"); if (!v) return {};
      var s = JSON.parse(v);
      if (s.budgets && typeof s.budgets === "object") return s.budgets;
      if (typeof s.budget === "number") { var mk = {}; mk[toKey(mondayOf(new Date()))] = s.budget; return mk; }
      return {};
    } catch (e) { return {}; }
  }
  function saveBudgetsLS(map) { try { LS.setItem("settings", JSON.stringify({ budgets: map })); } catch (e) {} }
  function weekBudgetOf(start) { var b = state.budgets[toKey(start)]; return typeof b === "number" ? b : DEFAULT_BUDGET; }
  function listDayKeys() { var out = []; for (var i = 0; i < LS.length; i++) { var k = LS.key(i); if (k && k.indexOf("day:") === 0) out.push(k); } return out; }

  /* ---------- backup / restore ---------- */
  function collectAll() {
    var out = { app: "the-five", version: 2, exported: new Date().toISOString(), settings: { budgets: state.budgets }, days: {} };
    var keys = listDayKeys();
    for (var i = 0; i < keys.length; i++) {
      try { out.days[keys[i].slice(4)] = JSON.parse(LS.getItem(keys[i])); } catch (e) {}
    }
    return out;
  }
  function toTSV(all) {
    var header = ["Date","M1","M1 time","M2","M2 time","M3","M3 time","M4","M4 time","M5","M5 time","Extras","Alcohol","Exercise","DH","Eaten","Net"];
    var rows = [header.join("\t")];
    var dates = Object.keys(all.days).sort();
    for (var i = 0; i < dates.length; i++) {
      var d = normalizeDay(all.days[dates[i]]);
      var cols = [dates[i]];
      d.meals.forEach(function (m) { cols.push(fmt(m.p)); cols.push(m.t || ""); });
      cols.push(fmt(d.extras), fmt(d.alcohol), fmt(d.exercise), d.dh ? "yes" : "", fmt(consumeOf(d)), fmt(netOf(d)));
      rows.push(cols.join("\t"));
    }
    return rows.join("\n");
  }

  /* ---------- state ---------- */
  var state = { budgets: {}, days: [], selected: null, todayKey: null, weekStart: null, outIsBackup: false };

  function rebuildWindow() {
    state.days = daysFrom(state.weekStart).map(function (date) {
      var k = toKey(date);
      return { key: k, date: date, data: loadDayLS(k) };
    });
    if (!state.selected || !state.days.some(function (d) { return d.key === state.selected; })) {
      state.selected = state.days.some(function (d) { return d.key === state.todayKey; }) ? state.todayKey : state.days[0].key;
    }
    renderMain();
  }
  function goToWeek(start) {
    state.weekStart = new Date(start); state.weekStart.setHours(0, 0, 0, 0);
    state.selected = null;
    rebuildWindow();
  }
  function reloadWeek() {
    state.budgets = loadBudgetsLS();
    rebuildWindow();
  }

  /* ---------- render pieces ---------- */
  function pipsHTML(value, tone) {
    var filled = Math.round(value / STEP), shown = Math.min(filled, 8), count = Math.max(4, shown);
    var s = '<div class="pips ' + tone + '">';
    for (var p = 0; p < count; p++) s += '<span class="pip' + (p < shown ? " on" : "") + '"></span>';
    if (filled > 8) s += '<span class="more">+' + fmt((filled - 8) * STEP) + '</span>';
    return s + '</div>';
  }
  function stepperHTML(value, max, tone, target) {
    return '<div class="stepper">' +
      '<button class="btn" data-action="dec" data-target="' + target + '" data-max="' + max + '"' + (value <= 0 ? " disabled" : "") + ' aria-label="minus">' + ICON.minus + '</button>' +
      '<div class="mval serif ' + tone + '">' + fmt(value) + '</div>' +
      '<button class="btn plus ' + tone + '" data-action="inc" data-target="' + target + '" data-max="' + max + '"' + (value >= max ? " disabled" : "") + ' aria-label="plus">' + ICON.plus + '</button>' +
      '</div>';
  }
  function rowHTML(o) {
    var right = '<div class="controls">';
    if (o.timeIdx != null) {
      var mc = !!o.checkVal;
      right += '<input type="checkbox" class="mealcheck" data-action="mealcheck" data-idx="' + o.timeIdx + '"' + (mc ? " checked" : "") + ' aria-label="' + o.label + ' done" />';
      right += '<input type="time" class="time' + (mc ? " checked" : "") + '" data-action="time" data-idx="' + o.timeIdx + '" value="' + (o.timeVal || "") + '" aria-label="' + o.label + ' time" />';
    }
    right += stepperHTML(o.value, o.max, o.tone, o.target) + '</div>';
    var hasNote = o.note != null;
    var noteHTML = hasNote ? '<input type="text" class="alcnote" data-action="alcnote" value="' + escAttr(o.note) + '" />' : "";
    return '<div class="item">' +
      '<div class="ilabel"><b>' + o.label + '</b></div>' +
      '<div class="rowkcal ' + o.tone + (hasNote ? " nogrow" : "") + '">' + (o.value * KCAL_PER_POINT).toLocaleString() + ' kcal</div>' +
      noteHTML + right +
      '</div>';
  }

  function renderMain() {
    var days = state.days, sel = state.selected, budget = weekBudgetOf(state.weekStart);
    var selDay = days.filter(function (d) { return d.key === sel; })[0];
    var weekConsume = days.reduce(function (a, x) { return a + (x.data.dead ? 0 : consumeOf(x.data)); }, 0);
    var weekEx = days.reduce(function (a, x) { return a + (x.data.dead ? 0 : x.data.exercise); }, 0);
    var weekNet = weekConsume - weekEx;
    var remaining = budget - weekNet, over = remaining < 0;
    var fillPct = Math.max(0, Math.min(100, (weekNet / budget) * 100));
    var dConsume = selDay ? consumeOf(selDay.data) : 0;
    var dEx = selDay ? selDay.data.exercise : 0;
    var dNet = selDay ? netOf(selDay.data) : 0;
    var dDead = selDay ? selDay.data.dead : false;
    var dComplete = selDay ? selDay.data.complete : false;
    var dDH = selDay ? selDay.data.dh : false;
    var dWhey = selDay ? selDay.data.whey : 0;

    var html = "";

    html += '<div class="weeknav">' +
      '<button class="wkbtn" data-action="prevweek" aria-label="previous week">' + ICON.chevL + '</button>' +
      '<div class="wkcenter">' +
        '<div class="wkrange serif">' + rangeLabel(state.weekStart) + '</div>' +
        '<input type="date" class="wkstart" data-action="setstart" value="' + toKey(state.weekStart) + '" aria-label="week start date" />' +
      '</div>' +
      '<button class="wkbtn wkt" data-action="thisweek" aria-label="jump to this week">T</button>' +
      '<button class="wkbtn" data-action="nextweek" aria-label="next week">' + ICON.chevR + '</button>' +
      '</div>';

    html += '<div class="strip">';
    days.forEach(function (d) {
      var t = netOf(d.data);
      var flag = d.data.dead ? " dead" : (d.data.complete ? " done" : "");
      html += '<div class="day' + (d.key === sel ? " sel" : "") + flag + '" data-action="selday" data-key="' + d.key + '">' +
        (d.key === state.todayKey ? '<span class="todot"></span>' : "") +
        '<div class="dow">' + dowLabel(d.date) + '</div>' +
        '<div class="dtot' + (t === 0 ? " zero" : "") + '">' + fmt(t) + '</div></div>';
    });
    html += '</div>';

    html += '<div class="head"><div>' +
      '<div class="hlabel">' + dayHeading(selDay) + '</div>' +
      '<div class="bignum serif">' + fmt(dNet) + '<span>pts net</span></div>' +
      '<div class="breakdown">' + fmt(dConsume) + ' eaten' + (dEx > 0 ? ' &middot; <span class="ex">' + fmt(dEx) + ' exercise</span>' : "") + ' &middot; &asymp; ' + (dNet * KCAL_PER_POINT).toLocaleString() + ' kcal' + (dDead ? ' &middot; <span class="deadnote">not counted</span>' : "") + '</div>' +
      '</div><div class="headright">' +
      '<div class="dayflags">' +
      '<button class="flagtoggle dead' + (dDead ? " on" : "") + '" data-action="toggledead" aria-pressed="' + dDead + '">Off Day</button>' +
      '<button class="flagtoggle complete' + (dComplete ? " on" : "") + '" data-action="togglecomplete" aria-pressed="' + dComplete + '">Complete</button>' +
      '<button class="flagtoggle dh' + (dDH ? " on" : "") + '" data-action="toggledh" aria-pressed="' + dDH + '">DH</button>' +
      '</div>' +
      '<div class="whey"><span class="wheylbl">whey</span>' +
      '<button class="wheybtn" data-action="wheydec" aria-label="fewer whey shots">' + ICON.minus14 + '</button>' +
      '<span class="wheyval serif">' + dWhey + '</span>' +
      '<button class="wheybtn" data-action="wheyinc" aria-label="more whey shots">' + ICON.plus14 + '</button></div>' +
      '</div></div>';

    html += '<div class="items">';
    for (var i = 0; i < 5; i++) {
      var m = selDay.data.meals[i];
      html += rowHTML({ label: "Meal " + (i + 1), tone: "food", value: m.p, max: MAX_MEAL, target: "meal:" + i, timeVal: m.t, timeIdx: i, checkVal: m.c });
    }
    html += rowHTML({ label: "Extras", tone: "food", value: selDay.data.extras, max: MAX_FIELD, target: "field:extras" });
    html += rowHTML({ label: "Alcohol", tone: "food", value: selDay.data.alcohol, max: MAX_FIELD, target: "field:alcohol", note: selDay.data.alcoholNote || "" });
    html += rowHTML({ label: "Exercise", tone: "ex", value: selDay.data.exercise, max: MAX_EX, target: "field:exercise" });
    html += '</div>';

    html += '<div class="week"><div class="wrow"><span class="lbl">This week (net)</span>' +
      '<span class="wnum serif">' + fmt(weekNet) + ' <span class="of">/ ' + fmt(budget) + '</span></span></div>' +
      '<div class="track"><div class="fill' + (over ? " over" : "") + '" style="width:' + fillPct + '%"></div></div>' +
      '<div class="wsub"><span class="brk">' + fmt(weekConsume) + ' eaten &middot; <span class="ex">' + fmt(weekEx) + ' off</span></span>' +
      '<span class="rem' + (over ? " over" : "") + '">' + (over ? fmt(-remaining) + " over" : fmt(remaining) + " left") + '</span></div></div>';

    html += '<div class="foot"><div class="bud"><span>Weekly budget</span>' +
      '<input type="number" class="budinput serif" data-action="budinput" value="' + fmt(budget) + '" min="1" max="60" step="0.5" inputmode="decimal" aria-label="weekly budget" /></div>' +
      '<div class="footbtns"><button class="reset" data-action="quicksave">' + ICON.share + ' Save</button>' +
      '<button class="reset" data-action="toggledata">' + ICON.db + ' Data</button>' +
      '<button class="reset" data-action="reset">' + ICON.rot + ' Reset week</button></div></div>';

    document.getElementById("main").innerHTML = html;
  }

  /* ---------- mutations ---------- */
  function mutateSelected(kind, ref, delta, max) {
    var d = state.days.filter(function (x) { return x.key === state.selected; })[0];
    if (kind === "meal") { var i = +ref; d.data.meals[i].p = clampPt(d.data.meals[i].p + delta, max); if (d.data.meals[i].p === 0) d.data.meals[i].t = ""; }
    else { d.data[ref] = clampPt(d.data[ref] + delta, max); }
    saveDayLS(d.key, d.data);
    renderMain();
  }
  function commitBudget(v) { var b = Math.max(1, Math.min(60, Math.round(v * 2) / 2)); state.budgets[toKey(state.weekStart)] = b; saveBudgetsLS(state.budgets); renderMain(); }

  /* ---------- data panel ---------- */
  function setMsg(m) { document.getElementById("dp-msg").textContent = m; }
  function setOut(text, msg) {
    document.getElementById("dp-out").value = text;
    document.getElementById("dp-out-wrap").style.display = "block";
    setMsg(msg);
  }
  function loadLastBackup() { try { var v = LS.getItem("lastBackup"); return v ? +v : 0; } catch (e) { return 0; } }
  function markBackedUp() { try { LS.setItem("lastBackup", String(Date.now())); } catch (e) {} renderMain(); }
  function quickSave() {
    var text = JSON.stringify(collectAll(), null, 2);
    if (navigator.share) {
      try {
        if (navigator.canShare) {
          var file = new File([text], "the-five-backup.json", { type: "application/json" });
          if (navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "the five backup" }).then(markBackedUp).catch(function () {});
            return;
          }
        }
        navigator.share({ title: "the five backup", text: text }).then(markBackedUp).catch(function () {});
        return;
      } catch (e) { return; }
    }
    try {
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "the-five-backup.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      markBackedUp();
    } catch (e) {}
  }
  function copyOut() {
    var ta = document.getElementById("dp-out");
    ta.focus(); ta.select();
    var done = function () { setMsg("Copied to clipboard."); if (state.outIsBackup) markBackedUp(); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done)
        .catch(function () { setMsg("Couldn\u2019t copy automatically \u2014 tap the text, Select All, then Copy."); });
    } else {
      setMsg("Tap the text above, choose Select All, then Copy.");
    }
  }
  function shareOut() {
    var text = document.getElementById("dp-out").value;
    if (!text) return;
    var done = function () { setMsg("Shared \u2014 save it somewhere safe."); if (state.outIsBackup) markBackedUp(); };
    try {
      if (state.outIsBackup && navigator.canShare) {
        var file = new File([text], "the-five-backup.json", { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "the five backup" }).then(done).catch(function () {});
          return;
        }
      }
      if (navigator.share) {
        navigator.share({ title: "the five backup", text: text }).then(done).catch(function () {});
      } else {
        setMsg("Sharing isn\u2019t available here \u2014 use Copy instead.");
      }
    } catch (e) {
      if (navigator.share) { navigator.share({ text: text }).then(done).catch(function () {}); }
      else setMsg("Sharing isn\u2019t available here \u2014 use Copy instead.");
    }
  }
  function toggleData() {
    var p = document.getElementById("datapanel");
    p.style.display = (p.style.display === "none" ? "block" : "none");
    setMsg("");
  }
  function doRestore() {
    var v = document.getElementById("dp-in").value;
    try {
      var parsed = JSON.parse(v);
      if (parsed.settings) {
        if (parsed.settings.budgets && typeof parsed.settings.budgets === "object") {
          Object.keys(parsed.settings.budgets).forEach(function (k) {
            if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof parsed.settings.budgets[k] === "number") state.budgets[k] = parsed.settings.budgets[k];
          });
        } else if (typeof parsed.settings.budget === "number") {
          state.budgets[toKey(mondayOf(new Date()))] = parsed.settings.budget;
        }
        saveBudgetsLS(state.budgets);
      }
      var n = 0, days = parsed.days || {};
      Object.keys(days).forEach(function (date) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(date)) { saveDayLS(date, normalizeDay(days[date])); n++; }
      });
      reloadWeek();
      document.getElementById("dp-in").value = "";
      setMsg("Restored " + n + " day" + (n === 1 ? "" : "s") + " of data.");
    } catch (e) {
      setMsg("That didn\u2019t read as a valid backup. Paste the whole JSON you exported.");
    }
  }

  /* ---------- events (delegated) ---------- */
  function onClick(e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el) return;
    var a = el.getAttribute("data-action");
    if (a === "selday") { state.selected = el.getAttribute("data-key"); renderMain(); }
    else if (a === "prevweek") { goToWeek(addDays(state.weekStart, -7)); }
    else if (a === "nextweek") { goToWeek(addDays(state.weekStart, 7)); }
    else if (a === "thisweek") { goToWeek(mondayOf(new Date())); }
    else if (a === "toggledead") {
      var dd = state.days.filter(function (x) { return x.key === state.selected; })[0];
      if (dd) { dd.data.dead = !dd.data.dead; if (dd.data.dead) dd.data.complete = false; saveDayLS(dd.key, dd.data); renderMain(); }
    }
    else if (a === "togglecomplete") {
      var dc = state.days.filter(function (x) { return x.key === state.selected; })[0];
      if (dc) { dc.data.complete = !dc.data.complete; if (dc.data.complete) dc.data.dead = false; saveDayLS(dc.key, dc.data); renderMain(); }
    }
    else if (a === "toggledh") {
      var dh0 = state.days.filter(function (x) { return x.key === state.selected; })[0];
      if (dh0) { dh0.data.dh = !dh0.data.dh; saveDayLS(dh0.key, dh0.data); renderMain(); }
    }
    else if (a === "wheyinc" || a === "wheydec") {
      var dw = state.days.filter(function (x) { return x.key === state.selected; })[0];
      if (dw) { dw.data.whey = Math.max(0, Math.min(20, dw.data.whey + (a === "wheyinc" ? 1 : -1))); saveDayLS(dw.key, dw.data); renderMain(); }
    }
    else if (a === "inc" || a === "dec") {
      var parts = el.getAttribute("data-target").split(":");
      mutateSelected(parts[0], parts[1], a === "inc" ? STEP : -STEP, +el.getAttribute("data-max"));
    }
    else if (a === "reset") {
      if (window.confirm("Clear all points for this week? This can't be undone.")) {
        state.days.forEach(function (d) { delDayLS(d.key); d.data = emptyDay(); });
        renderMain();
      }
    }
    else if (a === "toggledata") { toggleData(); }
    else if (a === "quicksave") { quickSave(); }
    else if (a === "exportjson") { state.outIsBackup = true; setOut(JSON.stringify(collectAll(), null, 2), "Backup ready. Save it (Files, Notes or email), or copy it to your other device."); }
    else if (a === "exporttsv") { state.outIsBackup = false; setOut(toTSV(collectAll()), "Spreadsheet copy ready. Paste it into Excel or Google Sheets."); }
    else if (a === "copyout") { copyOut(); }
    else if (a === "saveout") { shareOut(); }
    else if (a === "restore") { doRestore(); }
  }
  function onChange(e) {
    var t = e.target;
    var timeEl = t.closest ? t.closest('[data-action="time"]') : null;
    if (timeEl) {
      var idx = +timeEl.getAttribute("data-idx");
      var d = state.days.filter(function (x) { return x.key === state.selected; })[0];
      // Save only — do NOT re-render here, or we'd destroy the input and orphan the iOS time picker.
      if (d) { d.data.meals[idx].t = timeEl.value; saveDayLS(d.key, d.data); }
      return;
    }
    var wk = t.closest ? t.closest('[data-action="setstart"]') : null;
    if (wk && wk.value) {
      var p = wk.value.split("-");
      goToWeek(new Date(+p[0], +p[1] - 1, +p[2]));
      return;
    }
    var an = t.closest ? t.closest('[data-action="alcnote"]') : null;
    if (an) {
      var dn = state.days.filter(function (x) { return x.key === state.selected; })[0];
      if (dn) { dn.data.alcoholNote = an.value; saveDayLS(dn.key, dn.data); }
      return;
    }
    var bi = t.closest ? t.closest('[data-action="budinput"]') : null;
    if (bi) {
      var bv = parseFloat(bi.value);
      if (!isNaN(bv)) commitBudget(bv); else renderMain();
      return;
    }
    var mch = t.closest ? t.closest('[data-action="mealcheck"]') : null;
    if (mch) {
      var mci = +mch.getAttribute("data-idx");
      var dmc = state.days.filter(function (x) { return x.key === state.selected; })[0];
      if (dmc) { dmc.data.meals[mci].c = mch.checked; saveDayLS(dmc.key, dmc.data); renderMain(); }
    }
  }
  function onFocusOut(e) {
    // When a time picker fully closes, refresh once so meal-gap text updates.
    var el = e.target;
    if (el && el.closest && el.closest('[data-action="time"]')) {
      setTimeout(function () {
        var af = document.activeElement;
        if (!af || !af.closest || !af.closest('[data-action="time"]')) renderMain();
      }, 0);
    }
  }

  /* ---------- home-screen icon (generated, no extra files) ---------- */
  function makeIcon() {
    try {
      var c = document.createElement("canvas"); c.width = 180; c.height = 180;
      var x = c.getContext("2d"), r = 40;
      x.fillStyle = "#d97757";
      x.beginPath();
      x.moveTo(r, 0); x.arcTo(180, 0, 180, 180, r); x.arcTo(180, 180, 0, 180, r);
      x.arcTo(0, 180, 0, 0, r); x.arcTo(0, 0, 180, 0, r); x.closePath(); x.fill();
      x.fillStyle = "#f7ebe4";
      x.font = "700 112px Georgia, serif";
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText("5", 90, 100);
      var url = c.toDataURL("image/png");
      var apple = document.createElement("link"); apple.rel = "apple-touch-icon"; apple.href = url; document.head.appendChild(apple);
      var fav = document.createElement("link"); fav.rel = "icon"; fav.href = url; document.head.appendChild(fav);
    } catch (e) {}
  }

  /* ---------- init ---------- */
  document.body.addEventListener("click", onClick);
  document.body.addEventListener("change", onChange);
  document.body.addEventListener("focusout", onFocusOut);
  makeIcon();
  state.todayKey = toKey(new Date());
  state.weekStart = mondayOf(new Date());
  reloadWeek();
})();
</script>
</body>
</html>
